[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-cnn-portfolio"
version = "0.1.0"
description = "A reproducible 1D CNN proof-of-concept for learning transcription-factor motifs from DNA sequences."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
